<script>
'use strict';
(() => {
  const $ = id => document.getElementById(id);
  const NS = 'http://www.w3.org/2000/svg';
  const TAU = Math.PI * 2, BB = {x:583,y:496}, R = 29, L1 = 89, L2 = 91;
  const cadence = TAU * .48, gear = 2.1, wheelRadius = 90;
  const reduced = matchMedia('(prefers-reduced-motion: reduce)');
  let playing = !reduced.matches, speed = 1, elapsed = 0, last = null, request = null, night = false, showBones = false;
  const point = (x,y) => ({x,y});
  const fmt = n => n.toFixed(3);
  const path = (a,b) => `M${fmt(a.x)} ${fmt(a.y)}L${fmt(b.x)} ${fmt(b.y)}`;
  const set = (id,key,value) => $(id).setAttribute(key,value);
  const wrap = (x,min,span) => ((x-min)%span+span)%span+min;
  function node(tag,attrs,parent) { const el=document.createElementNS(NS,tag);for(const [key,value] of Object.entries(attrs))el.setAttribute(key,value);parent.append(el);return el; }
  for (const [id,cx] of [['rear-wheel',410],['front-wheel',740]]) {
    const parent=$(id);
    node('circle',{cx,cy:510,r:90,fill:'#e4dfc5',stroke:'#344f44','stroke-width':10},parent);
    node('circle',{cx,cy:510,r:82,fill:'none',stroke:'#f5eed6','stroke-width':3},parent);
    const spokes=node('g',{id:id+'-spokes',stroke:'#8b9e85','stroke-width':1.8},parent);
    for(let i=0;i<12;i++){const a=i*TAU/12;node('line',{x1:cx,y1:510,x2:cx+80*Math.cos(a),y2:510+80*Math.sin(a)},spokes);}
    node('circle',{cx:cx+67,cy:510,r:3,fill:'#d27350',stroke:'none'},spokes);
    node('circle',{cx,cy:510,r:8,fill:'#d2d7bd',stroke:'#567960','stroke-width':3},parent);
  }
  const rippleData=Array.from({length:17},(_,i)=>({x:(i*173)%1250,y:404+(i*19)%61,w:19+(i*7)%45}));
  rippleData.forEach((r,i)=>node('path',{id:'ripple-'+i},$('ripples')));
  const plants=Array.from({length:12},(_,i)=>({x:i*119,y:i%2?665:542,flower:i%3===0}));
  plants.forEach((p,i)=>node('use',{id:'plant-'+i,href:p.flower?'#flower':'#grass'},$('roadside')));
  // Circle intersection: the foot is the target; select the forward knee solution.
  function solveLeg(hip,foot) {
    const dx=foot.x-hip.x,dy=foot.y-hip.y,d=Math.hypot(dx,dy);
    if(d>L1+L2 || d<Math.abs(L1-L2)) throw new RangeError('Unreachable pedal');
    const a=(L1*L1-L2*L2+d*d)/(2*d),h=Math.sqrt(Math.max(0,L1*L1-a*a));
    return point(hip.x+a*dx/d+h*dy/d,hip.y+a*dy/d-h*dx/d);
  }
  function legPose(theta,side) {
    const phase=theta+(side==='far'?Math.PI:0),offset=side==='far'?-7:0;
    const bob=Math.sin(theta*2)*2.4;
    const hip=point(526+offset,369+bob);
    const pedal=point(BB.x+offset+R*Math.cos(phase),BB.y+R*Math.sin(phase));
    const ankle=point(pedal.x,pedal.y-8);
    return {hip,pedal,ankle,knee:solveLeg(hip,ankle)};
  }
  function drawLeg(side,pose){
    const {hip,knee,ankle,pedal}=pose;
    set(side+'-thigh','d',path(hip,knee));set(side+'-shin','d',path(knee,ankle));
    set(side+'-arm','d',path(point(BB.x+(side==='far'?-7:0),BB.y),pedal));
    set(side+'-pedal','d',`M${fmt(pedal.x-15)} ${fmt(pedal.y)}h30`);
    set(side+'-foot','d',`M${fmt(ankle.x-13)} ${fmt(ankle.y-5)}q9-7 15 0l16 7q2 5-6 5h-22q-6-1-3-12Z`);
    if(side==='near'){set('near-knee','cx',knee.x);set('near-knee','cy',knee.y);}
  }
  function draw(time){
    const theta=time*cadence,bob=Math.sin(theta*2)*2.4,travel=time*cadence*gear*wheelRadius;
    drawLeg('far',legPose(theta,'far'));const near=legPose(theta,'near');drawLeg('near',near);
    set('rider','transform',`translate(0 ${fmt(bob)})`);
    set('wing','d',`M553 ${298+bob}Q598 ${300+bob} 661 337L728 350Q739 361 722 362L649 355Q580 ${349+bob} 553 ${318+bob}Z`);
    set('wing-detail','d',`M569 ${318+bob}Q612 ${334+bob} 654 343M577 ${328+bob}Q607 ${343+bob} 635 345`);
    const wheelAngle=theta*gear*180/Math.PI;
    set('rear-wheel-spokes','transform',`rotate(${wheelAngle} 410 510)`);set('front-wheel-spokes','transform',`rotate(${wheelAngle} 740 510)`);
    set('chain','stroke-dashoffset',-theta*21);
    set('road-line','stroke-dashoffset',travel%84);
    set('scarf-tail','transform',`rotate(${Math.sin(theta-0.6)*4} 556 242)`);
    set('bill','transform',`rotate(${Math.sin(theta-0.8)*.5} 650 211)`);
    const blink=time%5.4;set('eye','transform',`translate(639 194) scale(1 ${blink>5.22 ? Math.max(.08,Math.abs(blink-5.31)/.09):1})`);
    set('cloud-a','transform',`translate(${wrap(130-time*5,-180,1500)} 166) scale(1.3)`);
    set('cloud-b','transform',`translate(${wrap(750-time*3,-180,1500)} 92) scale(.8)`);
    set('cloud-c','transform',`translate(${wrap(1090-time*7,-180,1500)} 245)`);
    set('sailboat','transform',`translate(${wrap(1010-time*8,-70,1380)} ${396+Math.sin(time*1.3)*1.7}) rotate(${Math.sin(time)*1.3})`);
    rippleData.forEach((r,i)=>{const x=wrap(r.x-time*(10+i%3*4),-90,1380);set('ripple-'+i,'d',`M${x} ${r.y}q${r.w/2} -2 ${r.w} 0`);});
    plants.forEach((p,i)=>set('plant-'+i,'transform',`translate(${wrap(p.x-travel*(p.y>600?1:.74),-60,1400)} ${p.y}) rotate(${Math.sin(time*2+i)*3})`));
    set('wind-a','d',`M${250-Math.sin(time*2)*9} 252h-36m-14 0h-13`);set('wind-b','d',`M${306-Math.sin(time*2+1)*13} 402h-45`);
    if(showBones){set('bones','d',path(near.hip,near.knee)+path(near.knee,near.ankle));for(const [id,p] of [['hip-marker',near.hip],['knee-marker',near.knee],['ankle-marker',near.ankle]]){set(id,'cx',p.x);set(id,'cy',p.y);}}
  }
  function frame(now){request=null;const dt=last===null?0:Math.min((now-last)/1000,.05);last=now;if(playing&&!document.hidden){elapsed+=dt*speed;draw(elapsed);schedule();}}
  function schedule(){if(playing&&!document.hidden&&request===null)request=requestAnimationFrame(frame);}
  function syncPlayback(){
    $('play').setAttribute('aria-label',playing?'暂停动画':'继续动画');$('play').setAttribute('aria-pressed',String(!playing));
    $('play-label').textContent=playing?'正在兜风':'歇一会儿';set('play-icon','d',playing?'M3 2h3v12H3zm7 0h3v12h-3z':'M4 1.5 14 8 4 14.5Z');
    last=null;if(!playing&&request!==null){cancelAnimationFrame(request);request=null;}schedule();
  }
  function toggle(){playing=!playing;syncPlayback();$('status').textContent=playing?'继续骑行':'动画已暂停';}
  $('play').addEventListener('click',toggle);
  $('speed').addEventListener('input',event=>{speed=Number(event.target.value);$('speed-value').textContent=speed.toFixed(2)+'×';});
  $('geometry').addEventListener('click',()=>{showBones=!showBones;set('skeleton','display',showBones?'inline':'none');$('geometry').setAttribute('aria-pressed',String(showBones));$('geometry').textContent=showBones?'隐藏骨架':'查看骨架';draw(elapsed);});
  $('theme').addEventListener('click',()=>{
    night=!night;document.body.classList.toggle('night',night);$('theme').setAttribute('aria-pressed',String(night));$('theme').textContent=night?'☀ 迎着日光':'☾ 等月亮来';$('weather').textContent=night?'夜 · 月色温柔':'晴 · 海风正好';
    for(const [id,attr,day,dark] of [['sky-top','stop-color','#d4e5d9','#233f4b'],['sky-bottom','stop-color','#f7e9cb','#607775'],['sea-top','stop-color','#83b7ad','#416e74'],['sea-bottom','stop-color','#b3cfc0','#73918a'],['island-back','fill','#abc7af','#4a706b'],['island-front','fill','#8dac96','#3d605e'],['shore','fill','#e4d7ae','#9caa91'],['verge','fill','#a7b791','#6f8874'],['road','fill','#ded8be','#9ba38b']])set(id,attr,night?dark:day);
    set('stars','opacity',night?'.8':'0');set('moon-cut','opacity',night?'1':'0');set('clouds','opacity',night?'.16':'.62');$('status').textContent=night?'已切换夜晚':'已切换白天';
  });
  document.addEventListener('visibilitychange',()=>{last=null;if(document.hidden&&request!==null){cancelAnimationFrame(request);request=null;}schedule();});
  document.addEventListener('keydown',event=>{if(event.code==='Space'&&!event.repeat&&!['BUTTON','INPUT','SELECT','TEXTAREA','A'].includes(document.activeElement.tagName)){event.preventDefault();toggle();}});
  reduced.addEventListener('change',event=>{if(event.matches){playing=false;syncPlayback();}});
  const mobile=matchMedia('(max-width:700px)');function fit(){set('scene','viewBox',mobile.matches?'260 45 660 635':'0 0 1200 680');}mobile.addEventListener('change',fit);fit();
  draw(0);syncPlayback();
})();
</script>
</body>
</html>
